---
version: "3"

# Point d'entrée du dépôt. `task` (sans argument) liste les commandes.
#
# Chaque domaine apporte son propre Taskfile, monté ici sous son namespace.
# L'include porte `dir:`, donc les tâches d'un domaine s'exécutent toujours
# depuis son répertoire — `task ansible:deploy` fonctionne depuis n'importe
# où dans le dépôt, sans que le Taskfile inclus ait à préfixer ses chemins.

includes:
  ansible:
    taskfile: ./ansible/Taskfile.yml
    dir: ./ansible

  terraform:
    taskfile: ./terraform/Taskfile.yml
    dir: ./terraform

  secrets:
    taskfile: ./secrets/Taskfile.yml
    dir: ./secrets

tasks:
  default:
    desc: Liste les commandes disponibles
    silent: true
    cmds:
      - task --list
