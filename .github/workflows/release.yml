# Publishes GitHub releases consumed by the Terraform Registry.
# Trigger: push a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# Required repository secrets:
#   GPG_PRIVATE_KEY — ASCII-armored private key whose public half is registered
#                     on registry.terraform.io (User Settings → Signing Keys)
#   PASSPHRASE      — passphrase of that key (empty string if none)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
