# Forgejo Actions port of .github/workflows/release.yml.
#
# Publishes a Forgejo release with registry-compliant assets (zips per
# platform, manifest, SHA256SUMS + binary GPG signature) via GoReleaser's
# native Gitea/Forgejo support (`gitea_urls` in .goreleaser.yml + GITEA_TOKEN).
#
# Trigger: push a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# Required repository secrets (Settings → Actions → Secrets):
#   GPG_PRIVATE_KEY — ASCII-armored private signing key
#   PASSPHRASE      — its passphrase (empty string if none)
# Optional:
#   RELEASE_TOKEN   — personal access token with repository write; only needed
#                     if the automatic GITHUB_TOKEN lacks release permissions.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod

      # crazy-max/ghaction-import-gpg is GitHub-only; plain gpg does the job.
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY secret is not set" >&2; exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          # Pre-cache the passphrase so the non-interactive signing step works.
          if [ -n "$PASSPHRASE" ]; then
            echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
            gpg-connect-agent reloadagent /bye
            keygrip=$(gpg --list-secret-keys --with-colons --with-keygrip | awk -F: '/^grp:/ {print $10; exit}')
            /usr/lib/gnupg/gpg-preset-passphrase --preset "$keygrip" <<< "$PASSPHRASE"
          fi

      - name: Run GoReleaser
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          "$(go env GOPATH)/bin/goreleaser" release --clean
