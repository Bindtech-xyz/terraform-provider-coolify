---
version: "3"

# Secrets du dépôt, chiffrés par SOPS.
#
# Domaine à part, et pas une sous-partie de `terraform:` ou `ansible:` : les
# secrets servent les deux, et les manipuler ne devrait pas demander de savoir
# lequel les consomme.
#
# Un fichier par domaine consommateur plutôt qu'un fichier global : les noms
# de variables diffèrent (`TF_VAR_*` pour Terraform, `vault_*` pour Ansible),
# et surtout un playbook Ansible n'a aucune raison de voir les identifiants
# de l'API Contabo.
#
# Aucun `.sops.yaml` ici : sops le cherche en REMONTANT depuis le fichier et
# trouve /projects/.sops.yaml, qui déclare déjà les destinataires (clé
# maîtresse macOS + compte admin de la VM). En poser un localement le
# masquerait et créerait une seconde liste de clés à maintenir.
#
# Les fichiers `*.enc.yaml` SONT versionnés — c'est tout l'intérêt : le
# chiffrement porte sur les valeurs, la structure reste lisible dans un diff.

vars:
  DIR: '{{.ROOT_DIR}}/secrets'

# `resolve.sh` est appelé DANS chaque commande, jamais dans une variable de
# niveau fichier : celles-ci sont évaluées AVANT que Task ne fusionne les
# variables de la ligne de commande, et FILE y serait toujours vide. Constaté
# au test — `FILE=terraform` était ignoré et la résolution échouait.
#
# Sa règle : FILE s'il est donné, sinon l'unique fichier existant, sinon un
# refus qui liste les candidats. Pas de défaut arbitraire, pas de paramètre
# inutile quand il n'y a rien à choisir.

tasks:
  default:
    desc: Liste les fichiers de secrets et leur état
    silent: true
    cmds:
      - |
        for f in {{.DIR}}/*.enc.yaml; do
          [ -e "$f" ] || { echo "  aucun fichier chiffré"; break; }
          printf "  %-28s %s\n" "$(basename "$f")" \
            "$(grep -q 'sops:' "$f" && echo chiffré || echo 'EN CLAIR — à chiffrer')"
        done

  create:
    silent: true
    requires:
      vars: [FILE]
    desc: Crée un fichier de secrets à partir du modèle, puis le chiffre
    status:
      - test -f {{.DIR}}/{{.FILE}}.enc.yaml
    cmds:
      - cp {{.DIR}}/{{.FILE}}.example.yaml {{.DIR}}/{{.FILE}}.enc.yaml
      # Chiffré immédiatement : le fichier en clair n'existe que le temps de
      # la copie, jamais entre deux commandes.
      - sops --encrypt --in-place {{.DIR}}/{{.FILE}}.enc.yaml
      - |
        echo "Créé et chiffré : {{.FILE}}.enc.yaml"
        echo "Y mettre les vraies valeurs : task secrets:edit FILE={{.FILE}}"

  edit:
    silent: true
    desc: Édite un fichier de secrets — déchiffré en mémoire, rechiffré à la sortie
    cmds:
      - |
        f=$({{.DIR}}/resolve.sh {{.DIR}} {{.FILE}})
        # `|| rc=$?` et non `; rc=$?` : Task exécute avec `set -e`, donc un
        # `sops` en échec interromprait le script avant le test. Placer
        # l'appel dans un contexte de condition suspend ce comportement.
        rc=0
        sops "$f" || rc=$?
        # 200 = « fichier non modifié ». Quitter l'éditeur sans rien changer
        # est un résultat légitime, pas une erreur.
        [ "$rc" -eq 0 ] || [ "$rc" -eq 200 ] || exit "$rc"

  view:
    silent: true
    desc: Affiche les secrets en clair — à réserver au diagnostic
    cmds:
      - |
        f=$({{.DIR}}/resolve.sh {{.DIR}} {{.FILE}})
        echo "⚠  Valeurs en clair sur ce terminal. Ne pas rediriger vers un fichier :"
        echo "   'sops -d > .env' recrée exactement le problème que SOPS résout."
        echo
        sops --decrypt "$f"

  updatekeys:
    silent: true
    desc: Rechiffre TOUS les fichiers pour les destinataires actuels
    cmds:
      # Sans FILE, et c'est voulu : ajouter ou retirer une clé dans
      # /projects/.sops.yaml concerne tous les fichiers. En oublier un, c'est
      # découvrir des mois plus tard qu'un destinataire ne peut pas le lire.
      - |
        for f in {{.DIR}}/*.enc.yaml; do
          [ -e "$f" ] || continue
          echo "  $(basename "$f")"
          sops updatekeys --yes "$f"
        done

  # ---- Forme par domaine -----------------------------------------------
  # Jokers : `task secrets:ansible:edit`, `task secrets:terraform:view`.
  # `.MATCH` récupère ce qui a été capturé par l'astérisque, donc un nouveau
  # domaine fonctionne sans rien ajouter ici.
  #
  # Cette forme dit le fichier ET l'action dans le nom de la commande : ni
  # paramètre à retenir, ni défaut implicite qui ferait éditer le mauvais.
  '*:edit':
    desc: Édite les secrets d'un domaine — task secrets:<domaine>:edit
    silent: true
    cmds:
      - task: edit
        vars: {FILE: '{{index .MATCH 0}}'}

  '*:view':
    desc: Affiche les secrets d'un domaine — task secrets:<domaine>:view
    silent: true
    cmds:
      - task: view
        vars: {FILE: '{{index .MATCH 0}}'}

  '*:create':
    desc: Crée les secrets d'un domaine — task secrets:<domaine>:create
    silent: true
    cmds:
      - task: create
        vars: {FILE: '{{index .MATCH 0}}'}
