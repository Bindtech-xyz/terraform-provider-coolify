---
version: "3"

# Secrets du dépôt, chiffrés par SOPS.
#
# Domaine à part, et pas une sous-partie de `terraform:` ou `ansible:` : les
# secrets servent les deux, et les manipuler ne devrait pas demander de savoir
# lequel les consomme.
#
# Un fichier par domaine consommateur plutôt qu'un fichier global : les noms
# de variables diffèrent (`TF_VAR_*` pour Terraform, `vault_*` pour Ansible),
# et surtout un playbook Ansible n'a aucune raison de voir les identifiants
# de l'API Contabo.
#
# Aucun `.sops.yaml` ici : sops le cherche en REMONTANT depuis le fichier et
# trouve /projects/.sops.yaml, qui déclare déjà les destinataires (clé
# maîtresse macOS + compte admin de la VM). En poser un localement le
# masquerait et créerait une seconde liste de clés à maintenir.
#
# Les fichiers `*.enc.yaml` SONT versionnés — c'est tout l'intérêt : le
# chiffrement porte sur les valeurs, la structure reste lisible dans un diff.
#
# ── Partir de zéro ──────────────────────────────────────────────────────
#
#     task secrets:terraform:create   # crée le fichier, déjà chiffré
#     task secrets:terraform:edit     # y met les vraies valeurs
#
# `create` part de `<domaine>.example.yaml` s'il existe, sinon d'un squelette
# généré. Le fichier n'existe jamais en clair entre deux commandes.
#
# Un fichier créé À LA MAIN (donc en clair, sans métadonnées sops) n'est pas
# une impasse : `edit` le chiffre d'abord, `encrypt` le fait explicitement,
# et `view` refuse en expliquant quoi faire — c'est l'incident
# « sops metadata not found » d'août 2026, rendu impossible à reproduire.

vars:
  DIR: '{{.ROOT_DIR}}/secrets'

  # Les fonctions shell partagées vivent ICI, injectées en tête de chaque
  # commande via {{.HELPERS}} : une seule définition, zéro fichier annexe.
  #
  #   resolve   FILE s'il est donné, sinon l'unique fichier existant, sinon
  #             un refus qui liste les candidats. Pas de défaut arbitraire —
  #             un défaut ferait éditer le mauvais fichier en silence — et
  #             pas de paramètre exigé quand il n'y a rien à choisir.
  #
  #   encrypted vrai si le fichier porte les métadonnées sops. C'est LE test
  #             qui distingue un vrai fichier chiffré d'un squelette créé à
  #             la main.
  #
  # Injecté dans chaque commande et jamais dans une variable de niveau
  # fichier évaluée trop tôt : celles-ci sont résolues AVANT la fusion des
  # variables de la ligne de commande, et FILE y serait toujours vide.
  # Constaté au test — `FILE=terraform` était ignoré.
  HELPERS: |
    resolve() {
        local dir="$1" want="${2:-}"
        if [ -n "$want" ]; then
            printf '%s/%s.enc.yaml\n' "$dir" "$want"
            return 0
        fi
        local files=()
        for f in "$dir"/*.enc.yaml; do [ -e "$f" ] && files+=("$f"); done
        case ${#files[@]} in
        0)
            echo "Aucun fichier de secrets dans $dir." >&2
            echo "En créer un : task secrets:<domaine>:create" >&2
            return 1
            ;;
        1)  printf '%s\n' "${files[0]}" ;;
        *)
            echo "Plusieurs fichiers de secrets — préciser lequel :" >&2
            for f in "${files[@]}"; do
                echo "    FILE=$(basename "$f" .enc.yaml)" >&2
            done
            return 1
            ;;
        esac
    }
    encrypted() { grep -q '^sops:' "$1"; }

tasks:
  default:
    desc: Liste les fichiers de secrets et leur état
    silent: true
    cmds:
      - |
        {{.HELPERS}}
        for f in {{.DIR}}/*.enc.yaml; do
          [ -e "$f" ] || { echo "  aucun fichier chiffré"; break; }
          printf "  %-28s %s\n" "$(basename "$f")" \
            "$(encrypted "$f" && echo chiffré || echo 'EN CLAIR — task secrets:encrypt')"
        done

  create:
    silent: true
    requires:
      vars: [FILE]
    desc: Crée un fichier de secrets chiffré — depuis le modèle s'il existe, sinon un squelette
    status:
      - test -f {{.DIR}}/{{.FILE}}.enc.yaml
    cmds:
      # Chiffré immédiatement : le fichier en clair n'existe que le temps de
      # la copie, jamais entre deux commandes. Le squelette généré contient
      # une paire obligatoire — sops refuse un document YAML vide.
      - |
        {{.HELPERS}}
        target={{.DIR}}/{{.FILE}}.enc.yaml
        if [ -f {{.DIR}}/{{.FILE}}.example.yaml ]; then
          cp {{.DIR}}/{{.FILE}}.example.yaml "$target"
        else
          printf '# Secrets « {{.FILE}} » — renseigner via : task secrets:{{.FILE}}:edit\nplaceholder: ""\n' > "$target"
        fi
        sops --encrypt --in-place "$target"
        echo "Créé et chiffré : {{.FILE}}.enc.yaml"
        echo "Y mettre les vraies valeurs : task secrets:{{.FILE}}:edit"

  encrypt:
    silent: true
    desc: Chiffre un fichier de secrets créé à la main (encore en clair)
    cmds:
      - |
        {{.HELPERS}}
        f=$(resolve {{.DIR}} "{{.FILE}}")
        if encrypted "$f"; then
          echo "$(basename "$f") est déjà chiffré — rien à faire."
        else
          sops --encrypt --in-place "$f"
          echo "Chiffré : $(basename "$f")"
        fi

  edit:
    silent: true
    desc: Édite un fichier de secrets — déchiffré en mémoire, rechiffré à la sortie
    cmds:
      - |
        {{.HELPERS}}
        f=$(resolve {{.DIR}} "{{.FILE}}")
        [ -f "$f" ] || { echo "$(basename "$f") n'existe pas — task secrets:{{.FILE}}:create" >&2; exit 1; }
        # Un fichier créé à la main est chiffré d'abord : sops refuserait de
        # l'ouvrir (« sops metadata not found »), et l'éditer en clair
        # laisserait des secrets nus sur le disque.
        if ! encrypted "$f"; then
          echo "$(basename "$f") était en clair — chiffré avant édition."
          sops --encrypt --in-place "$f"
        fi
        # `|| rc=$?` et non `; rc=$?` : Task exécute avec `set -e`, donc un
        # `sops` en échec interromprait le script avant le test. Placer
        # l'appel dans un contexte de condition suspend ce comportement.
        rc=0
        sops "$f" || rc=$?
        # 200 = « fichier non modifié ». Quitter l'éditeur sans rien changer
        # est un résultat légitime, pas une erreur.
        [ "$rc" -eq 0 ] || [ "$rc" -eq 200 ] || exit "$rc"

  view:
    silent: true
    desc: Affiche les secrets en clair — à réserver au diagnostic
    cmds:
      - |
        {{.HELPERS}}
        f=$(resolve {{.DIR}} "{{.FILE}}")
        # `view` ne modifie rien, y compris un fichier mal créé : il explique.
        if [ -f "$f" ] && ! encrypted "$f"; then
          echo "$(basename "$f") est EN CLAIR (créé à la main ?)." >&2
          echo "Le chiffrer : task secrets:encrypt FILE=$(basename "$f" .enc.yaml)" >&2
          exit 1
        fi
        echo "⚠  Valeurs en clair sur ce terminal. Ne pas rediriger vers un fichier :"
        echo "   'sops -d > .env' recrée exactement le problème que SOPS résout."
        echo
        sops --decrypt "$f"

  updatekeys:
    silent: true
    desc: Rechiffre TOUS les fichiers pour les destinataires actuels
    cmds:
      # Sans FILE, et c'est voulu : ajouter ou retirer une clé dans
      # /projects/.sops.yaml concerne tous les fichiers. En oublier un, c'est
      # découvrir des mois plus tard qu'un destinataire ne peut pas le lire.
      - |
        {{.HELPERS}}
        for f in {{.DIR}}/*.enc.yaml; do
          [ -e "$f" ] || continue
          if ! encrypted "$f"; then
            echo "  $(basename "$f") — EN CLAIR, ignoré (task secrets:encrypt)"
            continue
          fi
          echo "  $(basename "$f")"
          sops updatekeys --yes "$f"
        done

  # ---- Forme par domaine -----------------------------------------------
  # Jokers : `task secrets:ansible:edit`, `task secrets:terraform:view`.
  # `.MATCH` récupère ce qui a été capturé par l'astérisque, donc un nouveau
  # domaine fonctionne sans rien ajouter ici.
  #
  # Cette forme dit le fichier ET l'action dans le nom de la commande : ni
  # paramètre à retenir, ni défaut implicite qui ferait éditer le mauvais.
  '*:edit':
    desc: Édite les secrets d'un domaine — task secrets:<domaine>:edit
    silent: true
    cmds:
      - task: edit
        vars: {FILE: '{{index .MATCH 0}}'}

  '*:view':
    desc: Affiche les secrets d'un domaine — task secrets:<domaine>:view
    silent: true
    cmds:
      - task: view
        vars: {FILE: '{{index .MATCH 0}}'}

  '*:create':
    desc: Crée les secrets d'un domaine — task secrets:<domaine>:create
    silent: true
    cmds:
      - task: create
        vars: {FILE: '{{index .MATCH 0}}'}

  '*:encrypt':
    desc: Chiffre les secrets d'un domaine créés à la main — task secrets:<domaine>:encrypt
    silent: true
    cmds:
      - task: encrypt
        vars: {FILE: '{{index .MATCH 0}}'}
