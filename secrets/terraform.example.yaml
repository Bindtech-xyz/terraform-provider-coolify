# Secrets consommés par les tests d'acceptance et par tout usage manuel du
# provider (terraform apply, task secrets:terraform:view pour du diagnostic).
#
#   task secrets:terraform:create   # copie ce modèle en terraform.enc.yaml, chiffre
#   task secrets:terraform:edit     # renseigne les vraies valeurs

# Instance Coolify ciblée. Vide = Coolify Cloud (https://app.coolify.io).
# /api/v1 est ajouté automatiquement, inutile de le mettre ici.
coolify_endpoint: "https://coolify.example.com"

# Créé dans Coolify → Keys & Tokens → API tokens.
# Ability `write` minimum pour que le provider fonctionne ; ajouter
# `read:sensitive` pour que les identifiants générés par Coolify (mots de
# passe de base de données, clés S3, valeurs de variables d'env...)
# remontent dans le state au lieu d'y rester masqués — voir le guide
# "Token Abilities & Sensitive Data" de la doc du provider.
coolify_token: ""

# --- Uniquement si l'instance est derrière un edge authentifiant ----------
# Cloudflare Access, oauth2-proxy, une gateway mTLS par header... Le
# provider ne connaît aucun de ces mécanismes en particulier : les deux
# clés ci-dessous alimentent l'attribut générique `headers` du bloc
# provider, qui envoie n'importe quel header fixe sur chaque requête.
#
# Laisser vide si l'instance est joignable directement — la plupart le
# sont, ce bloc est l'exception, pas la règle.
#
# Cas Cloudflare Access : Zero Trust → Access → Service Auth → Service
# Tokens → Create. Le Client Secret n'est affiché qu'une fois à la
# création — le récupérer immédiatement ou le régénérer si perdu. Voir le
# guide "Reaching Coolify Behind an Authenticating Edge" de la doc du
# provider pour le scope de la policy Access (sur /api/* uniquement, pas
# sur le dashboard).
cf_access_client_id: ""
cf_access_client_secret: ""
