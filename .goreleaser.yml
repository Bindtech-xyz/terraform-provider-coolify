# GoReleaser configuration producing Terraform-Registry-compliant release
# assets (zips, manifest, signed SHA256SUMS).
# Reference: https://developer.hashicorp.com/terraform/registry/providers/publishing
#
# The release target is picked from the token in the environment:
#   GITHUB_TOKEN → GitHub release (needed for registry.terraform.io)
#   GITEA_TOKEN  → Forgejo release on the instance below
#     (used by .forgejo/workflows/release.yml)
version: 2

gitea_urls:
  api: https://git.lan.bdigitalservices.com/api/v1
  download: https://git.lan.bdigitalservices.com

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # Providers are fully static: no CGO.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # The registry requires a binary (non-armored) detached signature made
      # with the GPG key registered on the publisher account.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
